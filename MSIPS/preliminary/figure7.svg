   <g id="text_1">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(190.515938 30.564422)">Define the decision</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(147.495937 40.642453)">Requester, resource, action and policy</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(159.800625 83.556422)">Characterize candidate evidence</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(144.729844 93.634453)">Seven dimensions and attack scenarios</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(163.505391 136.548422)">Enforce admissibility and gates</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(111.851016 146.626453)">Privacy, freshness, provenance and function coverage</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(198.283359 189.540422)">Select evidence</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(128.987578 199.618453)">Exact optimization or feasible reverse deletion</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(149.696719 242.532422)">Check every required attack scenario</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(139.223672 252.610453)">Residual support, functions and gate trust</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(161.197734 295.524422)">Assign representations and tiers</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(127.034297 305.602453)">Local, edge, protected storage or shared status</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(2.60925 198.355875) rotate(-90)">Revise policy</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(11.5675 195.723375) rotate(-90)">or evidence</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(20.52575 195.288375) rotate(-90)">if infeasible</text>
   </g>
